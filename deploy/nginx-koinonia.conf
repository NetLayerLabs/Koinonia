# Koinonia (koinonia.netlayerlabs.com): static site from /opt/koinonia/dist, API on 127.0.0.1:8795 (systemd: koinonia)
server {
    server_name koinonia.netlayerlabs.com;
    listen 80;
    listen [::]:80;

    root /opt/koinonia/dist;
    index index.html;
    client_max_body_size 2m;

    # API, including live events (server-sent events): never buffer, keep long connections open.
    location /api/ {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Built assets have hashed names: cache them for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
